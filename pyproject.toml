[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ratestool"
version = "0.1.0"
description = "UST zero curve, KRW IRS valuation, KTB duration/convexity and delta-normal VaR, checked against Excel"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy"]

[project.optional-dependencies]
dev = ["pytest"]
notebook = ["matplotlib", "jupyterlab", "nbconvert", "nbformat"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
